services:
  - type: web
    name: classmon-api
    env: python
    buildCommand: "cd dashboard && npm install && npm run build && cd .. && pip install -r requirements.txt && python scripts/download_models.py"
    startCommand: "cd backend && uvicorn api.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8000
