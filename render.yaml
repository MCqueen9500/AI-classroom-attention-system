services:
  - type: web
    name: classmon-api
    env: python
    buildCommand: "cd dashboard && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn api.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 10000
      - key: CLASSMON_API_URL
        value: https://classmon-api.onrender.com
