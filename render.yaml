services:
  - type: web
    name: classmon-api
    env: python
    buildCommand: "cd dashboard && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "python scripts/start_classmon.py"
    envVars:
      - key: PORT
        value: 8000
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
